# Snowflake connection for the dbt service user created by sql/01_snowflake_setup.sql.
# The private key stays outside the repo. Set ECOMMERCE_PRIVATE_KEY_PATH to change where it is read from.
ecommerce:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'srsbxdh-uf12982') }}"
      user: DBT_USER
      private_key_path: "{{ env_var('ECOMMERCE_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.ecommerce_keys/dbt_user.p8') }}"
      role: DBT_ROLE
      warehouse: ECOMMERCE_WH
      database: ECOMMERCE_DB
      schema: STAGING
      threads: 4
