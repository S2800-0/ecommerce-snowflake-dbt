version: 2

models:
  - name: stg_customers
    description: One row per customer, cleaned. A blank city becomes Unknown and a blank email stays null.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: customer_name
        data_tests: [not_null]
      - name: signup_date
        description: Converted from text to a date.

  - name: stg_products
    description: One row per product, cleaned. Prices are numbers and must be positive.
    columns:
      - name: product_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: price
        data_tests: [not_null, positive]

  - name: stg_orders
    description: >
      One row per valid order. Exact duplicates, rows with a missing or non-positive quantity, and rows that
      point to a customer or product that does not exist are kept out and listed in stg_orders_rejected.
    columns:
      - name: order_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests: [not_null, positive]
      - name: status
        description: Standardised to lowercase.
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, pending, shipped, cancelled]

  - name: stg_orders_rejected
    description: The order rows kept out of stg_orders, each with the reason, so no row disappears silently.
    columns:
      - name: rejection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [invalid_order_id, duplicate_order, invalid_quantity, unknown_customer, unknown_product, unknown_status]
